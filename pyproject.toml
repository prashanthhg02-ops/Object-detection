[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "object-detection-aiml"
version = "0.1.0"
description = "A practical YOLO object detection project for images, video, and webcams"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.3.0",
    "opencv-python>=4.9.0",
]

[project.scripts]
object-detect = "main:main"
